<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Text Analyzer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>AI Text Analyzer</h1>

    <textarea id="userText" placeholder="Paste or type your text here..."></textarea>

    <div class="controls">
      <button id="analyzeBtn">Analyze Text</button>
      <button id="clearBtn">Clear</button>
    </div>

    <div id="result" class="card">
      <h2>Analysis Result</h2>
      <pre id="output">Waiting for analysis...</pre>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
